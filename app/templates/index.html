<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FinAtlas Greeting</title>
</head>
<body>
    <h1>FinAtlas AI Greeting</h1>
    {% if error %}
        <p style="color:red;">{{ error }}</p>
    {% else %}
        <p>{{ greeting }}</p>
    {% endif %}
    
    <hr>
    <h2>Status Panel</h2>
    <div id="status-panel">
        <p>Flask: <span id="flask-status">Checking...</span></p>
        <p>AI API: <span id="ai-status">Checking...</span></p>
        <p>CSV Loading: <span id="csv-status">Pending</span></p>
        <p>Supabase: <span id="supabase-status">Pending</span></p>
    </div>

    <script>
        async function fetchHealth() {
            try {
                const response = await fetch('/health');
                if (response.ok) {
                    document.getElementById('flask-status').textContent = 'Healthy';
                } else {
                    document.getElementById('flask-status').textContent = 'Unhealthy';
                }
            } catch (e) {
                document.getElementById('flask-status').textContent = 'Error';
            }
        }

        async function checkAiApi() {
            // Simple check: call the backend '/' and see if greeting or error is returned
            try {
                const response = await fetch('/');
                if (response.ok) {
                    const text = await response.text();
                    if (text.includes('API key missing')) {
                        document.getElementById('ai-status').textContent = 'API key missing';
                    } else {
                        document.getElementById('ai-status').textContent = 'OK';
                    }
                } else {
                    document.getElementById('ai-status').textContent = 'Error';
                }
            } catch (e) {
                document.getElementById('ai-status').textContent = 'Error';
            }
        }

        fetchHealth();
        checkAiApi();
    </script>
</body>
</html>
